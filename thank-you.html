<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>문의 접수 완료 | 포스엘엔에스</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />
    <link rel="stylesheet" href="./styles.css?v=62" />
    <style>
      .thanks-wrap {
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(180deg, #eef5ff 0%, #ffffff 78%);
      }
      .thanks-card {
        width: min(680px, 92%);
        background: #fff;
        border: 1px solid #dce5ee;
        border-radius: 14px;
        padding: 2rem 1.4rem;
        text-align: center;
      }
      .thanks-logo {
        height: clamp(48px, 6vw, 60px);
        margin-bottom: 1.25rem;
      }
      .thanks-card p {
        color: #5f6b78;
      }
    </style>
  </head>
  <body>
    <main class="thanks-wrap">
      <section class="thanks-card">
        <img src="./assets/logo-eng.png?v=5" alt="FLNS" class="thanks-logo" />
        <h1>문의가 정상 접수되었습니다.</h1>
        <p>
          남겨주신 내용을 확인한 후 담당자가 빠르게 연락드리겠습니다.
          감사합니다.
        </p>
        <a href="./index.html" class="btn-primary">홈으로 돌아가기</a>
      </section>
    </main>
  </body>
</html>
